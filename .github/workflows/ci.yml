# CI Pipeline for electronics-ecommerce
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.x'
  # pnpm-workspace.yaml uses pnpm 10/11 keys (allowBuilds, minimumReleaseAgeExclude);
  # pnpm 9 rejects the file ("packages field missing or empty"). Keep CI aligned with the local toolchain.
  PNPM_VERSION: '11.x'

jobs:
  # ===========================================
  # Lint & Format
  # ===========================================
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

  # ===========================================
  # Type Check
  # ===========================================
  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Type Check
        run: pnpm astro check

  # ===========================================
  # Unit Tests
  # ===========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test --run

  # ===========================================
  # Build
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, unit-tests]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed the database
        # Two independent reasons this step must not run elsewhere: pull_request
        # carries the same secrets, so any PR would mutate the live project; and
        # migrate/seed write to the live database, which is an owner decision.
        # vars.ENABLE_DB_MIGRATION stays unset until that decision is made.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DB_MIGRATION == 'true'
        run: |
          pnpm db:migrate
          pnpm db:seed
        env:
          # Supabase's JS client cannot run DDL, so migrations need the direct
          # (session pooler) connection string, not the project URL.
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build Astro project
        run: pnpm build
        env:
          # Required for build-time API calls
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANALYTICS_HMAC_SECRET: ${{ secrets.ANALYTICS_HMAC_SECRET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ===========================================
  # E2E Tests
  # ===========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Playwright E2E tests
        run: |
          set -euo pipefail
          # Boot the static preview ourselves (bounded readiness wait).
          # Playwright's webServer must not manage the process (config uses
          # reuseExistingServer: true) — pnpm can detach the real child and the
          # runner would wait on a zombie.
          pnpm preview --host 127.0.0.1 --port 4321 > preview-e2e.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill $PREVIEW_PID 2>/dev/null || true; pkill -f "astro preview" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null 2>&1; then
              echo "Preview ready after ${i}s"
              READY=1
              break
            fi
            if ! kill -0 $PREVIEW_PID 2>/dev/null; then
              echo "::error::Preview process died early"
              cat preview-e2e.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Preview never became ready"
            cat preview-e2e.log
            exit 1
          fi
          pnpm exec playwright test
        env:
          # Preview serves prerendered pages that call Supabase at runtime.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANALYTICS_HMAC_SECRET: ${{ secrets.ANALYTICS_HMAC_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ===========================================
  # Bundle Size Audit
  # ===========================================
  bundle-audit:
    name: Bundle Size Audit
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Analyze bundle size
        run: |
          npx vite-bundle-analyzer dist --json > bundle-report.json
          cat bundle-report.json
        continue-on-error: true

      - name: Check bundle size budget
        run: |
          # Check total JS size < 100KB gzipped
          TOTAL_JS=$(find dist -name "*.js" -exec gzip -c {} \; | wc -c)
          echo "Total JS (gzipped): $TOTAL_JS bytes"
          if [ $TOTAL_JS -gt 102400 ]; then
            echo "::error::Bundle size exceeds 100KB budget: $TOTAL_JS bytes"
            exit 1
          fi
          echo "Bundle size OK: $TOTAL_JS bytes"

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.json
          retention-days: 7

  # ===========================================
  # Security Audit
  # ===========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  # ===========================================
  # Final Status
  # ===========================================
  final-status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, unit-tests, build, e2e-tests, bundle-audit, security-audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          JOBS="${{ toJson(needs) }}"
          echo "Checking job statuses..."
          # This will fail if any needed job failed
          echo "All required checks passed!"
